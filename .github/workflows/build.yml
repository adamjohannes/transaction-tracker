name: 🏗️ Build
on:
  push:

jobs:
  build-backend:
    name: Build and Validate Go API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      # Step 1: Check out repository's code so the workflow can access it
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Go and cache dependencies
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          # This enables caching for Go modules, speeding up dependency downloads
          cache: true

      # Step 3: Cache the Go build cache
      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      # Step 4: Run the 'go build' command
      - name: Build Project
        run: go build -v ./...

      # Step 5: Run the unit tests for all packages
      - name: Run Unit Tests
        run: go test -v ./...

  build-frontend:
    name: Build and Validate Vue
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      # Step 1: Check out repository's code so the workflow can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment and enable caching for dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install the project's frontend dependencies using npm
      - name: Install npm dependencies
        run: npm install

      # Step 4: Run the linter to check for code style and quality issues
      - name: Lint with ESLint
        run: npm run lint

      # Step 5: Run the build script to compile the application and perform type-checking
      - name: Build Vue Frontend
        run: npm run build
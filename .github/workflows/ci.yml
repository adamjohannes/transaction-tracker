name: 🚀 CI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Check out the repository's code to access the CHANGELOG.md file
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Extract the release notes for the specific tag from CHANGELOG.md
      - name: Extract Release Notes
        id: extract_notes
        # This improved script looks for a line starting with '##' that CONTAINS the tag version.
        # It's less strict about brackets or extra words.
        run: |
          awk '/^## .*'"${{ github.ref_name }}"'/ {p=1; next} p && /^## / {exit} p' CHANGELOG.md > release_notes.md
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      # Step 3: Print Release Notes
      - name: Verify Release Notes
        run: |
          echo "--- Content of release_notes.md ---"
          cat ${{ steps.extract_notes.outputs.notes_file }}
          echo "-----------------------------------"

      # Step 4: Create the GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.extract_notes.outputs.notes_file }}
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}